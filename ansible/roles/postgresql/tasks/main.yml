---
- name: Enable PostgreSQL module stream {{ postgresql_stream }}
  ansible.builtin.command:
    cmd: dnf -y module enable postgresql:{{ postgresql_stream }}
    creates: /etc/dnf/modules.d/postgresql.module

- name: Install PostgreSQL packages
  ansible.builtin.dnf:
    name: "{{ postgresql_packages }}"
    state: present

- name: Create socket and log directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0755"
  loop:
    - "{{ postgresql_socket_dir }}"
    - /var/log/lab/postgresql

# initdb directly instead of postgresql-setup, which needs systemd
- name: Initialise database cluster
  ansible.builtin.command:
    cmd: >-
      runuser -u postgres -- /usr/bin/initdb -D {{ postgresql_data_dir }}
      --encoding=UTF8 --locale=C --auth-local=peer --auth-host=scram-sha-256
    creates: "{{ postgresql_data_dir }}/PG_VERSION"

- name: Create conf.d directory
  ansible.builtin.file:
    path: "{{ postgresql_data_dir }}/conf.d"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Include conf.d from postgresql.conf
  ansible.builtin.lineinfile:
    path: "{{ postgresql_data_dir }}/postgresql.conf"
    regexp: "^#?include_dir\\s*="
    line: "include_dir = 'conf.d'"
  notify: Restart postgresql

- name: Write lab settings
  ansible.builtin.template:
    src: lab.conf.j2
    dest: "{{ postgresql_data_dir }}/conf.d/10-lab.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Restart postgresql

- name: Write pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ postgresql_data_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Reload postgresql

- name: Write pg_ident.conf
  ansible.builtin.template:
    src: pg_ident.conf.j2
    dest: "{{ postgresql_data_dir }}/pg_ident.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Reload postgresql

- name: Apply config changes before starting
  ansible.builtin.meta: flush_handlers

- name: Enable postgresql unit (systemd hosts only)
  ansible.builtin.systemd_service:
    name: postgresql
    enabled: true
  when: lab_use_systemd | bool

- name: Ensure postgresql is running
  ansible.builtin.command: "{{ lab_svc }} ensure-started postgresql"
  register: postgresql_start
  changed_when: "'STATE=started' in postgresql_start.stdout"

- name: Create application role
  community.postgresql.postgresql_user:
    name: "{{ postgresql_user }}"
    password: "{{ postgresql_password }}"
    login_user: postgres
    login_unix_socket: "{{ postgresql_socket_dir }}"
    port: "{{ postgresql_port }}"
  no_log: true

- name: Create application database
  community.postgresql.postgresql_db:
    name: "{{ postgresql_db }}"
    owner: "{{ postgresql_user }}"
    encoding: UTF8
    login_user: postgres
    login_unix_socket: "{{ postgresql_socket_dir }}"
    port: "{{ postgresql_port }}"

- name: Write connection settings for the admin scripts
  ansible.builtin.template:
    src: postgresql.env.j2
    dest: /etc/lab/postgresql.env
    owner: root
    group: root
    mode: "0600"
