---
- name: Restart postgresql
  ansible.builtin.command: "{{ lab_svc }} restart postgresql"
  changed_when: true

- name: Reload postgresql
  ansible.builtin.command: "runuser -u postgres -- /usr/bin/pg_ctl -D {{ postgresql_data_dir }} reload"
  register: postgresql_reload
  changed_when: true
  # nothing to reload before the first start
  failed_when: postgresql_reload.rc != 0 and 'no server running' not in postgresql_reload.stderr
